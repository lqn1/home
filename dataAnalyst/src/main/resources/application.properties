# 修改端口
server.port=8080

# THYMELEAF 配置（添加调试信息）
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
# 缓存控制（开发时设为false）
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# 开发时设为false便于调试
spring.thymeleaf.cache=false
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.content-type=text/html
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.excluded-view-names=
spring.thymeleaf.mode=HTML5
spring.thymeleaf.prefix=classpath:/static/
spring.thymeleaf.suffix=.html
spring.thymeleaf.template-resolver-order=1
spring.thymeleaf.servlet.content-type=text/html

# 启用Spring Boot的开发者工具（如果使用IDE）
spring.devtools.restart.enabled=true

#************H2 配置****************
# 数据源配置 - 添加参数确保数据库创建
spring.datasource.url=jdbc:h2:file:./data;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 控制台
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA 配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 初始化数据
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# application.yml
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
# 文件上传配置
file.upload.dir=./uploads

# 日志配置
logging.level.org.example.ncy=DEBUG
logging.level.org.apache.poi=WARN

# 初始化SQL

sql.init.mode=always
sql.init.schema-locations=classpath:schema.sql
sql.init.data-locations=classpath:data.sql
sql.init.procedure-locations=classpath:procedures.sql


# 文件存储配置
# 文件存储根目录
file.storage.path=/data/files
# 临时文件目录
file.storage.temp=/tmp/files
# 下载超时时间（毫秒）
file.download.timeout=30000
# 下载块大小
file.download.chunk-size=8192

file.security.allowed-extensions=xlsx,xls,pdf,txt,jpg,jpeg,png
file.security.max-file-size=100MB


# application.properties
app.temp.directory=/tmp/zip_files
app.zip.max-size=1073741824    # 1GB
app.zip.compression-level=6    # 压缩级别 0-9
app.zip.volume-size=104857600  # 分卷大小 100MB